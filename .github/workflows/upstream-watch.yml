name: upstream-watch

# Daily check for upstream activity this fork has not reviewed: Go
# vulnerability database advisories for github.com/crewjam/saml and
# github.com/russellhaering/goxmldsig, and new tags, commits and
# security-looking pull requests on crewjam/saml. New items are added to the
# open upstream-watch issue, or open one. See README "Watching upstream".

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths: [ '.github/upstream-watch/**', '.github/workflows/upstream-watch.yml' ]

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/upstream-watch
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/upstream-watch/go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Check upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCH_NOTIFY: nic-jennings
        # A pull request only proves the check runs; it never writes.
        run: go run . ${{ github.event_name == 'pull_request' && '-dry-run' || '' }}
